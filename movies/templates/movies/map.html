{% extends 'base.html' %}
{% block content %}
{% load static %}

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

<style>
    #map {
        height: 600px;
        width: 100%;
    }
    .dropdown {
        display: flex;
        justify-content: flex-end;
    }
</style>

<div id="map"></div>

<script>
    var map = L.map('map').setView([33.776174, -84.398815], 3); // Location of Georgia Tech campus

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    
    // Generate javascript objects using JSON lists passed in through movies/views.py
    const movies = JSON.parse('{{ movies_json|escapejs }}');
    const items = JSON.parse('{{ items_json|escapejs }}');

    /*
    // Test marker
    var marker = L.marker([33.774841, -84.396407]).addTo(map); // Location of CS2340 classroom
    marker.bindPopup("<b>The Dark Knight</b><br>25 sales")

    // Test code for accessing items and their regions
    items.forEach((element, index) => {
        region = element.fields.region
        console.log(region);
        console.log(index)
    });
    */
    

    // Create dictionary to hold trending movies for each region
    // topmovies will hold arrays of [moviename, numsales] for the most sold movies in the region
    var trending_movies = {
        "AF": {"topmovie1": [null, 0],  "topmovie2": [null, 0]},  // Africa
        "AN": {"topmovie1": [null, 0],  "topmovie2": [null, 0]},  // Antarctica
        "AS": {"topmovie1": [null, 0],  "topmovie2": [null, 0]},    // Asia
        "EU": {"topmovie1": [null, 0],  "topmovie2": [null, 0]},  // Europe
        "NA": {"topmovie1": [null, 0],  "topmovie2": [null, 0]},  // North America
        "OC": {"topmovie1": [null, 0],  "topmovie2": [null, 0]}, // Oceania
        "SA": {"topmovie1": [null, 0],  "topmovie2": [null, 0]} // South America
    };

    // For each value in this dictionary, create a nested dict which iterates over movies
    // and uses them as keys. Initial values all zero. Also has a key for top movie1 and 2.
    for (var region in trending_movies) {
        movies.forEach(movie => {
            trending_movies[region][movie.fields.name] = 0;
        });
    }

    // Iterate over the items, access the region -> movie and add 1 to that nested value
    items.forEach(item => {
        region = item.fields.region;
        movieName = movies[item.fields.movie - 1].fields.name;
        var x = ++trending_movies[region][movieName];  // increment counter
        // If this new value is greater than topmovie1, put topmovie1 in topmovie2 and overwrite topmovie1
        if (x > trending_movies[region]["topmovie1"][1]) {
            trending_movies[region]["topmovie2"] = trending_movies[region]["topmovie1"]
            trending_movies[region]["topmovie1"] = [movieName, x];
        }
        // else if greater than topmovie2 overwrite topmovie2
        else if (x > trending_movies[region]["topmovie2"][1]) {
            trending_movies[region]["topmovie2"] = [movieName, x];
        }
    });
    

    // TODO: For each marker, bind a popup to it.
    // If null, popup says "No movies sold here yet."
    // Otherwise, popup prints topmovie1 and 2 with sales number


    // Coordinates for region markers
    var region_coords = {
        "AF": [12.68142033751721, 20.268198669475503],  // Africa
        "AN": [-76.08582128335182, 21.94560590743792],  // Antarctica
        "AS": [47.55395811991787, 87.2904497271196],    // Asia
        "EU": [49.34737928105602, 12.825760986560464],  // Europe
        "NA": [39.62147416716466, -99.74048417383642],  // North America
        "OC": [-25.83732014300033, 141.23997363375128], // Oceania
        "SA": [-13.929939704940162, -59.82793422575491] // South America
    };

    for (var region in region_coords) {
        var marker = L.marker(region_coords[region]).addTo(map);
        var topmovie1 = trending_movies[region]["topmovie1"];
        var topmovie2 = trending_movies[region]["topmovie2"];

        if (topmovie1[0] == null) {
            marker.bindPopup("<b>No movies sold here yet!</b>");
        } else if (topmovie2[0] == null) {
            marker.bindPopup(`<b>Trending Movies:</b><br>${topmovie1[0]} - sales`);
        } else {
            marker.bindPopup(`<b>Trending Movies:</b><br>${topmovie1[0]} - ${topmovie1[1]} sales<br>${topmovie2[0]} - ${topmovie2[1]} sales`);
        }
        
    }

</script>

{% endblock content %}
